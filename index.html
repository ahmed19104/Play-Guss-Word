<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Word</title>

    <link rel="stylesheet" href="css.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h2>Guess The Word 🎯</h2>
    </header>

    <div class="container">
        <div class="play">
            <div class="inputs"></div>

            <div class="b">
                <button class="check-word">Check Word</button>
                <button class="hint">Hint (<span>3</span> left)</button>
            </div>
        </div>

        <div class="sider">
    <h3>🎨 Key Colors</h3>
    <div class="key-item Right">
        <span></span>
        <p><strong>Letter is Right</strong></p>
    </div>
    <div class="key-item Not-place">
        <span></span>
        <p><strong>Letter is Right but in Wrong Place</strong></p>
    </div>
    <div class="key-item Not">
        <span></span>
        <p><strong>Letter is Wrong</strong></p>
    </div>
</div>

    </div>

    <div class="good"></div>
    <footer class="ahmed">By Ahmed</footer>

    <script src="script.js"></script>
</body>
</html>

</body>
</html>
